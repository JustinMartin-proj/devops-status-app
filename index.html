<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoDaddy - Domain & Hosting Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7f8;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #d4dbe0;
            border-top: 5px solid #00a4a6; /* GoDaddy Signature Teal */
            border-radius: 8px;
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(17, 17, 17, 0.08);
        }
        .brand {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00a4a6;
            margin-bottom: 0.25rem;
        }
        h1 {
            color: #111111;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.25rem;
        }
        .info-row {
            margin: 0.75rem 0;
            font-size: 0.95rem;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 999px;
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .ssl-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 4px;
            background-color: #e0f7f7;
            color: #007a7c;
        }
        .meta {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #5e6c75;
            border-top: 1px solid #e8ecef;
            padding-top: 1rem;
        }
        .meta p {
            margin: 0.35rem 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">GoDaddy Control Center</div>
        <h1>Domain & Hosting Status</h1>
	<h1>Justin Martin </h1> 
        <div class="info-row">Domain: <strong>benevolentdecor.com</strong></div>
        <div class="info-row">Hosting Plan: <strong>Managed WordPress / cPanel/ VPS / Airo  </strong></div>

        <div class="info-row">DNS &amp; Domain Status: <span class="badge">ACTIVE</span></div>
        <div class="info-row">SSL Certificate: <span class="ssl-badge">SECURED (HTTPS)</span></div>
        <div class="meta">
            <p>Nameservers: ://domaincontrol.com</p>
            <p>Auto-Renew: Enabled (Registrar Lock ON)</p>
        </div>
    </div>
</body>
</html>
